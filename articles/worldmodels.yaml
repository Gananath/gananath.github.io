---
filename: worldmodels
other_menu: false
project_menu: true
sidebar: true
title: WorldModels
desc: Demo of JEPA-based world models
content: |
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    #app {
      width: 600px;
      margin: 20px auto;
    }

    #status {
      margin-bottom: 10px;
      padding: 10px;
      background: #222;
      border: 1px solid #444;
      border-radius: 6px;
      color: #aaa;
      font-family: monospace;
      white-space: pre-wrap;
    }

    #game {
      position: relative;
      width: 600px;
      height: 600px;
      background: black;
    }

    canvas {
      display: block;
      width: 600px;
      height: 600px;
      background: black;
    }

    #overlay {
      position: absolute;
      left: 0;
      top: 0;
      width: 600px;
      height: 155px;
      box-sizing: border-box;
      padding: 10px 15px;
      background: rgba(0, 0, 0, 0.75);
      pointer-events: none;
    }

    #step {
      font-size: 24px;
      margin-bottom: 8px;
      color: white;
    }

    #action {
      font-size: 24px;
      color: rgb(100, 255, 100);
      margin-bottom: 10px;
    }

    #help {
      font-size: 18px;
      line-height: 28px;
      color: white;
    }

    #help2 {
      font-size: 18px;
      color: rgb(255, 220, 100);
    }

    #log {
      margin-top: 10px;
      height: 150px;
      overflow-y: auto;
      padding: 10px;
      box-sizing: border-box;
      background: #000;
      border: 1px solid #333;
      color: #aaa;
      font-family: monospace;
      font-size: 12px;
      white-space: pre-wrap;
    }
  </style>

  <!-- ============================================================
       APPLICATION
       ============================================================ -->

  <div id="app">

    <div id="status">
      Starting...
    </div>

    <div id="game">

      <canvas
        id="canvas"
        width="600"
        height="600"
      ></canvas>

      <div id="overlay">

        <div id="step">
          STEP: 0
        </div>

        <div id="action">
          ACTION: [+0.0, +0.0, +0.0]
        </div>

        <div id="help">
          LEFT/RIGHT: steer
          &nbsp;&nbsp;
          UP: gas
          &nbsp;&nbsp;
          DOWN: brake
        </div>

        <div id="help2">
          ENTER/SPACE: advance
          &nbsp;&nbsp;
          C: zero
          &nbsp;&nbsp;
          R: reset
        </div>

      </div>

    </div>

    <div id="log"></div>

  </div>

  <!-- ============================================================
       ONNX RUNTIME
       ============================================================ -->

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.24.3/dist/ort.min.js"></script>

  <!-- ============================================================
       APPLICATION SCRIPT
       ============================================================ -->

  <script>
    "use strict";

    // ============================================================
    // CONFIG
    // ============================================================

    const SCREEN_WIDTH = 600;
    const SCREEN_HEIGHT = 600;
    const FPS = 60;

    // ============================================================
    // GITHUB REPOSITORY
    // ============================================================

    const REPO_BASE_URL =
      "https://raw.githubusercontent.com/Gananath/worldmodels_demo/main";

    const DYNAMICS_MODEL_URL =
      `${REPO_BASE_URL}/models/model.onnx`;

    const DECODER_MODEL_URL =
      `${REPO_BASE_URL}/models/decoder.onnx`;

    const INITIAL_STATE_URL =
      `${REPO_BASE_URL}/models/initial_state.json`;

    // ============================================================
    // ONNX RUNTIME
    // ============================================================

    ort.env.wasm.wasmPaths =
      "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.24.3/dist/";

    // ============================================================
    // DOM
    // ============================================================

    const canvas =
      document.getElementById("canvas");

    const ctx =
      canvas.getContext("2d");

    const statusElement =
      document.getElementById("status");

    const logElement =
      document.getElementById("log");

    // ============================================================
    // GLOBAL STATE
    // ============================================================

    let model = null;
    let decoder = null;
    let initialState = null;
    let latent = null;
    let step = 0;
    let inferenceRunning = false;

    let action =
      new Float32Array([
        0,
        0,
        0
      ]);

    const keys =
      new Set();

    // ============================================================
    // LOGGING
    // ============================================================

    function log(...args) {
      console.log(...args);

      logElement.textContent +=
        args
          .map(value => {
            if (typeof value === "object") {
              try {
                return JSON.stringify(value);
              } catch {
                return String(value);
              }
            }

            return String(value);
          })
          .join(" ") + "\n";

      logElement.scrollTop =
        logElement.scrollHeight;
    }

    // ============================================================
    // STATUS
    // ============================================================

    function setStatus(text) {
      statusElement.textContent =
        text;
    }

    // ============================================================
    // FETCH FILE
    // ============================================================

    async function fetchFile(
      url,
      name
    ) {
      log(
        `Downloading ${name}:`,
        url
      );

      setStatus(
        `Downloading ${name}...`
      );

      const response =
        await fetch(
          url,
          {
            cache: "no-cache"
          }
        );

      if (!response.ok) {
        throw new Error(
          `${name} download failed: ` +
          `${response.status} ${response.statusText}\n` +
          url
        );
      }

      const buffer =
        await response.arrayBuffer();

      if (buffer.byteLength === 0) {
        throw new Error(
          `${name} is empty`
        );
      }

      log(
        `${name} downloaded:`,
        buffer.byteLength,
        "bytes"
      );

      return buffer;
    }

    // ============================================================
    // LOAD ONNX
    // ============================================================

    async function loadONNXFromURL(
      url,
      name
    ) {
      const buffer =
        await fetchFile(
          url,
          name
        );

      log(
        `Creating ONNX session for ${name}...`
      );

      const session =
        await ort.InferenceSession.create(
          new Uint8Array(buffer),
          {
            executionProviders: [
              "wasm"
            ]
          }
        );

      log(
        `${name} loaded`
      );

      log(
        `${name} inputs:`,
        session.inputNames
      );

      log(
        `${name} outputs:`,
        session.outputNames
      );

      return session;
    }

    // ============================================================
    // LOAD INITIAL STATE
    // ============================================================

    async function loadInitialState() {
      log(
        "Downloading initial_state.json..."
      );

      setStatus(
        "Downloading initial_state.json..."
      );

      const response =
        await fetch(
          INITIAL_STATE_URL,
          {
            cache: "no-cache"
          }
        );

      if (!response.ok) {
        throw new Error(
          `Initial state download failed: ` +
          `${response.status} ${response.statusText}`
        );
      }

      const json =
        await response.json();

      if (!json.latent) {
        throw new Error(
          "initial_state.json does not contain 'latent'"
        );
      }

      const source =
        json.latent;

      if (
        !Array.isArray(source) ||
        source.length === 0
      ) {
        throw new Error(
          "Invalid latent data"
        );
      }

      const channels =
        source.length;

      const height =
        source[0].length;

      const width =
        source[0][0].length;

      log(
        "Initial latent dimensions:",
        [1, channels, height, width]
      );

      const values =
        new Float32Array(
          channels *
          height *
          width
        );

      let index = 0;

      for (
        let c = 0;
        c < channels;
        c++
      ) {
        for (
          let y = 0;
          y < height;
          y++
        ) {
          for (
            let x = 0;
            x < width;
            x++
          ) {
            const value =
              Number(
                source[c][y][x]
              );

            if (
              !Number.isFinite(value)
            ) {
              throw new Error(
                `Invalid latent value at ` +
                `[${c}][${y}][${x}]`
              );
            }

            values[index++] =
              value;
          }
        }
      }

      return {
        data: values,
        dims: [
          1,
          channels,
          height,
          width
        ]
      };
    }

    // ============================================================
    // COPY LATENT
    // ============================================================

    function copyLatent(value) {
      return {
        data:
          new Float32Array(
            value.data
          ),

        dims:
          [...value.dims]
      };
    }

    // ============================================================
    // LATENT TENSOR
    // ============================================================

    function createLatentTensor(value) {
      return new ort.Tensor(
        "float32",
        value.data,
        value.dims
      );
    }

    // ============================================================
    // ACTION TENSOR
    // ============================================================

    function createActionTensor() {
      return new ort.Tensor(
        "float32",
        new Float32Array([
          action[0],
          action[1],
          action[2]
        ]),
        [1, 3]
      );
    }

    // ============================================================
    // DECODE
    // ============================================================

    async function decode(value) {
      if (!decoder) {
        return;
      }

      log(
        "Decoding latent..."
      );

      const inputName =
        decoder.inputNames[0];

      const outputs =
        await decoder.run({
          [inputName]:
            createLatentTensor(
              value
            )
        });

      const outputName =
        decoder.outputNames[0];

      const tensor =
        outputs[outputName];

      if (!tensor) {
        throw new Error(
          "Decoder produced no output"
        );
      }

      const dims =
        Array.from(
          tensor.dims
        );

      log(
        "Decoder output shape:",
        dims
      );

      if (
        dims.length !== 4
      ) {
        throw new Error(
          `Expected decoder output [N,C,H,W], got ${dims}`
        );
      }

      const channels =
        dims[1];

      const height =
        dims[2];

      const width =
        dims[3];

      if (
        channels !== 3
      ) {
        throw new Error(
          `Expected 3 RGB channels, got ${channels}`
        );
      }

      const data =
        tensor.data;

      const imageData =
        new ImageData(
          width,
          height
        );

      const rgba =
        imageData.data;

      const channelSize =
        width *
        height;

      for (
        let y = 0;
        y < height;
        y++
      ) {
        for (
          let x = 0;
          x < width;
          x++
        ) {
          const p =
            y * width + x;

          let r =
            data[p];

          let g =
            data[
              channelSize + p
            ];

          let b =
            data[
              2 * channelSize + p
            ];

          if (
            !Number.isFinite(r) ||
            !Number.isFinite(g) ||
            !Number.isFinite(b)
          ) {
            throw new Error(
              "Decoder output contains NaN/INF"
            );
          }

          r =
            Math.max(
              0,
              Math.min(
                1,
                r / 2 + 0.5
              )
            );

          g =
            Math.max(
              0,
              Math.min(
                1,
                g / 2 + 0.5
              )
            );

          b =
            Math.max(
              0,
              Math.min(
                1,
                b / 2 + 0.5
              )
            );

          const offset =
            p * 4;

          rgba[offset] =
            Math.round(
              r * 255
            );

          rgba[offset + 1] =
            Math.round(
              g * 255
            );

          rgba[offset + 2] =
            Math.round(
              b * 255
            );

          rgba[offset + 3] =
            255;
        }
      }

      const imageCanvas =
        document.createElement(
          "canvas"
        );

      imageCanvas.width =
        width;

      imageCanvas.height =
        height;

      const imageCtx =
        imageCanvas.getContext(
          "2d"
        );

      imageCtx.putImageData(
        imageData,
        0,
        0
      );

      ctx.clearRect(
        0,
        0,
        SCREEN_WIDTH,
        SCREEN_HEIGHT
      );

      ctx.imageSmoothingEnabled =
        false;

      ctx.drawImage(
        imageCanvas,
        0,
        0,
        SCREEN_WIDTH,
        SCREEN_HEIGHT
      );

      log(
        "Decode complete."
      );
    }

    // ============================================================
    // AUTOMATIC INITIALIZATION
    // ============================================================

    async function initialize() {
      if (
        typeof ort === "undefined"
      ) {
        setStatus(
          "ERROR: ONNX Runtime Web did not load."
        );

        return;
      }

      try {
        log(
          "================================"
        );

        log(
          "AUTOMATIC MODEL LOADING"
        );

        log(
          "================================"
        );

        setStatus(
          "Loading dynamics model..."
        );

        model =
          await loadONNXFromURL(
            DYNAMICS_MODEL_URL,
            "Dynamics model"
          );

        setStatus(
          "Loading decoder..."
        );

        decoder =
          await loadONNXFromURL(
            DECODER_MODEL_URL,
            "Decoder model"
          );

        initialState =
          await loadInitialState();

        latent =
          copyLatent(
            initialState
          );

        action =
          new Float32Array([
            0,
            0,
            0
          ]);

        step = 0;

        setStatus(
          "Models loaded.\n" +
          "Decoding initial state..."
        );

        await decode(
          latent
        );

        updateUI();

        setStatus(
          "READY\n\n" +
          "Models and initial state loaded automatically.\n\n" +
          "LEFT / RIGHT = steer\n" +
          "UP = gas\n" +
          "DOWN = brake\n" +
          "ENTER / SPACE = advance\n" +
          "C = zero action\n" +
          "R = reset"
        );

        log(
          "================================"
        );

        log(
          "READY"
        );

        log(
          "================================"
        );
      }
      catch (error) {
        console.error(
          "STARTUP ERROR:",
          error
        );

        log(
          "STARTUP ERROR:",
          error
        );

        setStatus(
          "STARTUP ERROR:\n\n" +
          error.message
        );

        model = null;
        decoder = null;
        initialState = null;
        latent = null;
      }
    }

    // ============================================================
    // UPDATE ACTION
    // ============================================================

    function updateAction() {
      if (
        keys.has("ArrowLeft")
      ) {
        action[0] = -1;
      }
      else if (
        keys.has("ArrowRight")
      ) {
        action[0] = 1;
      }
      else {
        action[0] = 0;
      }

      if (
        keys.has("ArrowUp")
      ) {
        action[1] = 1;
      }
      else {
        action[1] = 0;
      }

      if (
        keys.has("ArrowDown")
      ) {
        action[2] = 1;
      }
      else {
        action[2] = 0;
      }

      updateUI();
    }

    // ============================================================
    // ADVANCE MODEL
    // ============================================================

    async function advance() {
      if (
        !model ||
        !decoder ||
        !latent
      ) {
        log(
          "Models are not loaded."
        );

        return;
      }

      if (
        inferenceRunning
      ) {
        return;
      }

      inferenceRunning =
        true;

      try {
        step++;

        log(
          "",
          `STEP ${step}`,
          `ACTION [${action[0]}, ${action[1]}, ${action[2]}]`
        );

        const stateTensor =
          createLatentTensor(
            latent
          );

        const actionTensor =
          createActionTensor();

        const outputs =
          await model.run({
            state:
              stateTensor,

            actions:
              actionTensor
          });

        const outputName =
          model.outputNames[0];

        const nextTensor =
          outputs[outputName];

        if (!nextTensor) {
          throw new Error(
            "Dynamics model produced no output"
          );
        }

        const nextData =
          nextTensor.data;

        for (
          let i = 0;
          i < nextData.length;
          i++
        ) {
          if (
            !Number.isFinite(
              nextData[i]
            )
          ) {
            throw new Error(
              "Dynamics output contains NaN/INF"
            );
          }
        }

        let min =
          Infinity;

        let max =
          -Infinity;

        let sum =
          0;

        let change =
          0;

        const oldData =
          latent.data;

        for (
          let i = 0;
          i < nextData.length;
          i++
        ) {
          const value =
            nextData[i];

          min =
            Math.min(
              min,
              value
            );

          max =
            Math.max(
              max,
              value
            );

          sum +=
            value;

          if (
            i < oldData.length
          ) {
            change +=
              Math.abs(
                value -
                oldData[i]
              );
          }
        }

        const mean =
          sum /
          nextData.length;

        change /=
          nextData.length;

        log(
          `LATENT: ${JSON.stringify(nextTensor.dims)}`
        );

        log(
          `min=${min.toFixed(4)} ` +
          `max=${max.toFixed(4)} ` +
          `mean=${mean.toFixed(4)} ` +
          `change=${change.toFixed(6)}`
        );

        latent = {
          data:
            new Float32Array(
              nextData
            ),

          dims:
            Array.from(
              nextTensor.dims
            )
        };

        await decode(
          latent
        );

        updateUI();
      }
      catch (error) {
        console.error(
          "INFERENCE ERROR:",
          error
        );

        log(
          "INFERENCE ERROR:",
          error.message
        );
      }
      finally {
        inferenceRunning =
          false;
      }
    }

    // ============================================================
    // RESET
    // ============================================================

    async function reset() {
      if (
        !initialState
      ) {
        return;
      }

      latent =
        copyLatent(
          initialState
        );

      action[0] = 0;
      action[1] = 0;
      action[2] = 0;

      step = 0;

      await decode(
        latent
      );

      updateUI();

      log(
        "RESET"
      );
    }

    // ============================================================
    // UI
    // ============================================================

    function updateUI() {
      document.getElementById(
        "step"
      ).textContent =
        `STEP: ${step}`;

      document.getElementById(
        "action"
      ).textContent =
        `ACTION: [` +
        `${action[0] >= 0 ? "+" : ""}` +
        `${action[0].toFixed(1)}, ` +
        `${action[1] >= 0 ? "+" : ""}` +
        `${action[1].toFixed(1)}, ` +
        `${action[2] >= 0 ? "+" : ""}` +
        `${action[2].toFixed(1)}` +
        `]`;
    }

    // ============================================================
    // KEYBOARD DOWN
    // ============================================================

    window.addEventListener(
      "keydown",
      async event => {
        keys.add(
          event.code
        );

        if (
          event.code === "ArrowLeft" ||
          event.code === "ArrowRight" ||
          event.code === "ArrowUp" ||
          event.code === "ArrowDown" ||
          event.code === "Space"
        ) {
          event.preventDefault();
        }

        if (
          event.code === "Enter" ||
          event.code === "Space"
        ) {
          await advance();
        }

        if (
          event.code === "KeyR"
        ) {
          await reset();
        }

        if (
          event.code === "KeyC"
        ) {
          keys.delete(
            "ArrowLeft"
          );

          keys.delete(
            "ArrowRight"
          );

          keys.delete(
            "ArrowUp"
          );

          keys.delete(
            "ArrowDown"
          );

          action[0] = 0;
          action[1] = 0;
          action[2] = 0;

          updateUI();
        }
      }
    );

    // ============================================================
    // KEYBOARD UP
    // ============================================================

    window.addEventListener(
      "keyup",
      event => {
        keys.delete(
          event.code
        );
      }
    );

    // ============================================================
    // 60 FPS LOOP
    // ============================================================

    let lastFrame =
      performance.now();

    async function gameLoop(
      timestamp
    ) {
      const elapsed =
        timestamp -
        lastFrame;

      if (
        elapsed >=
        1000 / FPS
      ) {
        lastFrame =
          timestamp;

        updateAction();

        if (
          action[0] !== 0 ||
          action[1] !== 0 ||
          action[2] !== 0
        ) {
          await advance();
        }
      }

      requestAnimationFrame(
        gameLoop
      );
    }

    // ============================================================
    // START AUTOMATICALLY
    // ============================================================

    initialize()
      .then(() => {
        requestAnimationFrame(
          gameLoop
        );
      });
  </script>
